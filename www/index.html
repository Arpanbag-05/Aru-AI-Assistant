<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARU</title>
    <link rel="shortcut icon" href="assets/img/aru.ico">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="assets/vendore/texllate/animate.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

    <!-- OVAL SECTION -->
    <section id="Oval" class="mb-4">
        <div class="row">
            <div class="col-md-1"></div>

            <div class="col-md-10">

                <div id="loader-wrapper">
                    <div id="loader">
                        <div id="loader1"></div>
                    </div>
                    <p>ARU</p>
                </div>

                <h5 class="text-light text text-center">Ask me anything!</h5>

                <!-- INPUT BOX -->
                <div class="col-md-12 mt-4 pt-4">
                    <div class="text-center">
                        <div id="textInput" class="d-flex">

                            <input type="text" class="input-field" name="chatBox" id="chatBox" placeholder="type here...">

                            <button id="MicBtn" class="glow-on-hover">
                                <i class="bi bi-mic"></i>
                            </button>

                            <button id="ChatBtn" class="glow-on-hover"
                                data-bs-toggle="offcanvas"
                                data-bs-target="#offcanvasScrolling">
                                <i class="bi bi-chat-dots"></i>
                            </button>

                            <button id="SettingsBtn" class="glow-on-hover">
                                <i class="bi bi-gear"></i>
                            </button>

                        </div>
                    </div>
                </div>

                <!-- ✅ OUTPUT BOX (IMPORTANT ADDITION) -->
                <div class="text-center mt-4">
                    <div id="output" class="aru-output">
                        Hello, I am A.R.U
                    </div>
                </div>

            </div>

            <div class="col-md-1"></div>
        </div>
    </section>

    <!-- SIRI WAVE -->
    <section id="SiriWave" class="mb-4" hidden>
        <div class="container">
            <div class="row">
                <div class="col-md-12">

                    <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
                        <div>
                            <h5 class="text-start text-light mb-4 siri-message" style="font-size: 28px;">
                                Hello, I am A.R.U
                            </h5>
                            <div id="siri-container"></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script src="main.js"></script>

<script src="assets/vendore/texllate/jquery.fittext.js"></script>
<script src="assets/vendore/texllate/jquery.lettering.js"></script>
<script src="http://jschr.github.io/textillate/jquery.textillate.js"></script>

<script type="text/javascript" src="/eel.js"></script>

<script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>
<script src="./controller.js"></script>

</body>
</html>
